version: 1
applications:
  - appRoot: src
    frontend:
      phases:
        preBuild:
          commands:
            # Gates, not advice. Each stops the build with the cause instead of a symptom far away from it.
            # Setting NODE_ENV on the Console makes `npm ci` skip devDependencies (tailwindcss, typescript),
            # and the build then dies at "Cannot find module '@tailwindcss/postcss'" (Zoney.vn-Web, 07/2026).
            - |
              if [ -n "$NODE_ENV" ]; then
                echo "=================================================================="
                echo "BUILD BI CHAN: NODE_ENV dang duoc set = '$NODE_ENV'"
                echo "Cach sua: xoa bien NODE_ENV khoi Amplify Console roi build lai."
                echo "Next.js tu quan ly NODE_ENV. Chi tiet: docs/06-trien-khai-amplify.md"
                echo "=================================================================="
                exit 1
              fi
            # Next.js 16 needs Node.js 20.9 or newer. Set it under Build settings > Build image settings >
            # Live package updates > Node.js (an exact version such as 22, never "latest").
            - |
              if ! node -e "const [a,b]=process.versions.node.split('.').map(Number); process.exit(a>20||(a===20&&b>=9)?0:1)"; then
                echo "=================================================================="
                echo "BUILD BI CHAN: Node.js $(node -v) qua cu, Next.js 16 can >= 20.9"
                echo "Cach sua: Build settings > Build image settings > Live package updates"
                echo "> Node.js = 22. Chi tiet: docs/06-trien-khai-amplify.md"
                echo "=================================================================="
                exit 1
              fi
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Console variables reach the build but not the Next.js server at runtime: write them to
            # .env.production, escaped so `$` and `#` in secrets survive (see scripts/amplify-env.mjs).
            - node scripts/amplify-env.mjs
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
