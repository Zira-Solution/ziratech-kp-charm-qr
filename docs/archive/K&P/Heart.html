<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodePen - Heart</title>
  <style>
canvas {
  position: absolute;
  left:0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,.2);
}
#reveal-btn {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  position: absolute;
  left: 50%;
  top: 75%;
  width: 64px;
  height: 64px;
  margin-left: -32px;
  border-radius: 50%;
  border: 1.5px solid hsla(0, 80%, 55%, .9);
  background: rgba(0,0,0,.6);
  color: hsl(0, 85%, 60%);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  box-shadow: 0 0 18px hsla(0, 90%, 50%, .45);
  transition: transform .2s, box-shadow .4s, background .4s;
  -webkit-tap-highlight-color: transparent;
}
#reveal-btn:hover { box-shadow: 0 0 28px hsla(0, 90%, 55%, .7); }
#reveal-btn:active { transform: scale(.92); }
#reveal-btn.on { background: hsl(0, 80%, 50%); color: #000; }
#reveal-btn svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<button id="reveal-btn" aria-label="Hiện trái tim"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.4C.4 8.4 2.3 4.5 6 4.5c2.2 0 3.6 1.2 4.4 2.5h3.2C14.4 5.7 15.8 4.5 18 4.5c3.7 0 5.6 3.9 4 7.1C19.5 16.4 12 21 12 21z"/></svg></button>
<script>
window.requestAnimationFrame =
    window.__requestAnimationFrame ||
        window.requestAnimationFrame ||
        window.webkitRequestAnimationFrame ||
        window.mozRequestAnimationFrame ||
        window.oRequestAnimationFrame ||
        window.msRequestAnimationFrame ||
        (function () {
            return function (callback, element) {
                var lastTime = element.__lastTime;
                if (lastTime === undefined) {
                    lastTime = 0;
                }
                var currTime = Date.now();
                var timeToCall = Math.max(1, 33 - (currTime - lastTime));
                window.setTimeout(callback, timeToCall);
                element.__lastTime = currTime + timeToCall;
            };
        })();
window.isDevice = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(((navigator.userAgent || navigator.vendor || window.opera)).toLowerCase()));
var loaded = false;
var init = function () {
    if (loaded) return;
    loaded = true;
    var mobile = window.isDevice;
    var koef = mobile ? 0.5 : 1;
    var canvas = document.getElementById('heart');
    var ctx = canvas.getContext('2d');
    var width = canvas.width = koef * innerWidth;
    var height = canvas.height = koef * innerHeight;
    var rand = Math.random;
    ctx.fillStyle = "rgba(0,0,0,1)";
    ctx.fillRect(0, 0, width, height);

    var heartPosition = function (rad) {
        //return [Math.sin(rad), Math.cos(rad)];
        return [Math.pow(Math.sin(rad), 3), -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))];
    };
    var scaleAndTranslate = function (pos, sx, sy, dx, dy) {
        return [dx + pos[0] * sx, dy + pos[1] * sy];
    };

    var btn = document.getElementById('reveal-btn');
    var placeBtn = function () {
        var fit = 0.7 * Math.min(1, width / 460, height / 520);
        btn.style.top = ((height / 2 + 260 * fit) / koef) + 'px';
    };
    var holding = false, revealMs = 0, lastTick = 0;
    var rays = [];
    var spawnRay = function () {
        var fit = 0.7 * Math.min(1, width / 460, height / 520);
        var sx = width / 2 + (rand() - 0.5) * 16 * koef;
        var sy = height / 2 + 260 * fit + 32 * koef;
        rays.push({
            sx: sx, sy: sy,
            bend: (rand() - 0.5) * width * 0.35,
            q: ~~(rand() * heartPointsCount),
            t: 0,
            speed: 0.018 + rand() * 0.012,
            f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(40 * rand() + 45) + "%,",
            trail: []
        });
    };
    var drawRays = function () {
        for (var r = rays.length; r--;) {
            var ray = rays[r];
            var tp = targetPoints[ray.q];
            ray.t = Math.min(1, ray.t + ray.speed);
            var t = ray.t, mt = 1 - t;
            var cx = (ray.sx + tp[0]) / 2 + ray.bend, cy = (ray.sy + tp[1]) / 2;
            var x = mt * mt * ray.sx + 2 * mt * t * cx + t * t * tp[0];
            var y = mt * mt * ray.sy + 2 * mt * t * cy + t * t * tp[1];
            ray.trail.unshift({x: x, y: y});
            if (ray.trail.length > 8) ray.trail.pop();
            var fade = t < 0.7 ? 1 : (1 - t) / 0.3;
            for (var j = 0; j < ray.trail.length - 1; j++) {
                var a = ray.trail[j], b = ray.trail[j + 1];
                ctx.strokeStyle = ray.f + (0.55 * fade * (1 - j / ray.trail.length)).toFixed(2) + ")";
                ctx.lineWidth = (koef < 1 ? 0.6 : 1);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }
            ctx.fillStyle = ray.f + (0.8 * fade).toFixed(2) + ")";
            ctx.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);
            if (t >= 1) rays.splice(r, 1);
        }
    };
    var startHold = function (ev) {
        ev.preventDefault();
        holding = true;
        lastTick = Date.now();
        btn.classList.add('on');
    };
    var endHold = function () {
        holding = false;
        btn.classList.remove('on');
    };
    btn.addEventListener('pointerdown', startHold);
    btn.addEventListener('pointerup', endHold);
    btn.addEventListener('pointerleave', endHold);
    btn.addEventListener('pointercancel', endHold);
    btn.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

    window.addEventListener('resize', function () {
        width = canvas.width = koef * innerWidth;
        height = canvas.height = koef * innerHeight;
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, width, height);
        placeBtn();
    });
    placeBtn();

    var traceCount = mobile ? 20 : 50;
    var pointsOrigin = [];
    var i;
    var dr = mobile ? 0.3 : 0.1;
    for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
    for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
    for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
    var heartPointsCount = pointsOrigin.length;

    var targetPoints = [];
    var pulse = function (kx, ky) {
        for (i = 0; i < pointsOrigin.length; i++) {
            targetPoints[i] = [];
            var fit = 0.7 * Math.min(1, width / 460, height / 520);
            targetPoints[i][0] = fit * kx * pointsOrigin[i][0] + width / 2;
            targetPoints[i][1] = fit * ky * pointsOrigin[i][1] + height / 2;
        }
    };

    var e = [];
    for (i = 0; i < heartPointsCount; i++) {
        var x = rand() * width;
        var y = rand() * height;
        e[i] = {
            vx: 0,
            vy: 0,
            R: 2,
            speed: rand() + 5,
            q: ~~(rand() * heartPointsCount),
            D: 2 * (i % 2) - 1,
            force: 0.2 * rand() + 0.7,
            f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(60 * rand() + 20) + "%,.3)",
            trace: []
        };
        for (var k = 0; k < traceCount; k++) e[i].trace[k] = {x: x, y: y};
    }

    var config = {
        traceK: 0.4,
        timeDelta: 0.01
    };

    var time = 0;
    var loop = function () {
        if (!holding) {
            window.requestAnimationFrame(loop, canvas);
            return;
        }
        var now = Date.now();
        revealMs += Math.min(100, now - lastTick);
        lastTick = now;
        var reveal = Math.min(1, revealMs / 4000);
        var n = -Math.cos(time);
        pulse((1 + n) * .5, (1 + n) * .5);
        time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? .2 : 1) * config.timeDelta;
        ctx.fillStyle = "rgba(0,0,0,.1)";
        ctx.fillRect(0, 0, width, height);
        for (i = e.length; i--;) {
            var u = e[i];
            var q = targetPoints[u.q];
            var dx = u.trace[0].x - q[0];
            var dy = u.trace[0].y - q[1];
            var length = Math.sqrt(dx * dx + dy * dy);
            if (10 > length) {
                if (0.95 < rand()) {
                    u.q = ~~(rand() * heartPointsCount);
                }
                else {
                    if (0.99 < rand()) {
                        u.D *= -1;
                    }
                    u.q += u.D;
                    u.q %= heartPointsCount;
                    if (0 > u.q) {
                        u.q += heartPointsCount;
                    }
                }
            }
            u.vx += -dx / length * u.speed;
            u.vy += -dy / length * u.speed;
            u.trace[0].x += u.vx;
            u.trace[0].y += u.vy;
            u.vx *= u.force;
            u.vy *= u.force;
            for (k = 0; k < u.trace.length - 1;) {
                var T = u.trace[k];
                var N = u.trace[++k];
                N.x -= config.traceK * (N.x - T.x);
                N.y -= config.traceK * (N.y - T.y);
            }
            ctx.globalAlpha = reveal;
            ctx.fillStyle = u.f;
            for (k = 0; k < u.trace.length; k++) {
                ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
            }
        }
        //ctx.fillStyle = "rgba(255,255,255,1)";
        //for (i = u.trace.length; i--;) ctx.fillRect(targetPoints[i][0], targetPoints[i][1], 2, 2);

        ctx.globalAlpha = 1;
        if (rand() < 0.22) spawnRay();
        ctx.lineCap = "round";
        drawRays();
        window.requestAnimationFrame(loop, canvas);
    };
    loop();
};

var s = document.readyState;
if (s === 'complete' || s === 'loaded' || s === 'interactive') init();
else document.addEventListener('DOMContentLoaded', init, false);
</script>
</body>
</html>
